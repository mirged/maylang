name: Tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/bootstrap.yml
  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install bootstrap requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils python3 libx11-dev libxi-dev libxcursor-dev libgl-dev fonts-dejavu-core xvfb xdotool
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the compiler from the tagged source
        run: sh compiler/rust/build.sh
      - name: Package twice and verify extracted installation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 dist/package.py --compiler compiler/mayc/mayc_new --release-tag "$RELEASE_TAG" --output /tmp/maylang-linux-x86_64.tar.gz --installer-output /tmp/maylang-installers
          python3 dist/package.py --compiler compiler/mayc/mayc_new --release-tag "$RELEASE_TAG" --output /tmp/maylang-repeat.tar.gz --installer-output /tmp/maylang-installers-repeat
          cmp /tmp/maylang-linux-x86_64.tar.gz /tmp/maylang-repeat.tar.gz
          cmp /tmp/maylang-installers/maylang-bootstrap.c /tmp/maylang-installers-repeat/maylang-bootstrap.c
          cmp /tmp/maylang-installers/maylang-install.sh /tmp/maylang-installers-repeat/maylang-install.sh
          cmp /tmp/maylang-installers/maylang-init-x86_64-linux /tmp/maylang-installers-repeat/maylang-init-x86_64-linux
          python3 dist/tests/test_package.py /tmp/maylang-linux-x86_64.tar.gz
          python3 dist/tests/test_installer.py --archive /tmp/maylang-linux-x86_64.tar.gz --artifacts /tmp/maylang-installers
          python3 dist/tests/test_download_installer.py --artifacts /tmp/maylang-installers
      - name: Package editor extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm exec --yes --package @vscode/vsce@3.6.2 -- vsce package --out /tmp/maylang-vscode.vsix
          cd /tmp
          sha256sum maylang-vscode.vsix > maylang-vscode.vsix.sha256
      - name: Read verified release identity
        id: identity
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('RELEASE.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('codename=' + metadata['codename'] + '\n')
          PY
      - name: Publish verified assets from the existing source tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CODENAME: ${{ steps.identity.outputs.codename }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file CHANGELOG.md --title "Maylang $RELEASE_TAG — $RELEASE_CODENAME"
          gh release upload "$RELEASE_TAG" /tmp/maylang-linux-x86_64.tar.gz /tmp/maylang-linux-x86_64.tar.gz.sha256 /tmp/maylang-vscode.vsix /tmp/maylang-vscode.vsix.sha256 dist/install.sh dist/install.ps1 /tmp/maylang-installers/*
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
