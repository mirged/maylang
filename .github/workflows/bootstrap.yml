name: Source-only bootstrap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils clang llvm python3 libx11-dev libxi-dev libxcursor-dev libgl-dev fonts-dejavu-core xvfb xdotool
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check the unified Rust workspace
        run: cargo test --offline --locked --workspace
      - name: Check synchronized public library reference
        run: |
          python3 docs/reference/generate.py --check
          python3 tools/maylsp/docs/generate.py --check
      - name: Build and verify three compiler generations from source
        run: |
          test ! -e compiler/mayc/build/bin/mayc_new
          python3 compiler/rust/test.py
      - name: Verify networking on native and LLVM backends
        run: |
          sh compiler/rust/build.sh
          python3 compiler/mayc/tests/network.py --require-sockets --llvm
      - name: Verify direct Maylang LLVM backend
        run: |
          python3 compiler/mayc/tests/llvm.py
          python3 compiler/mayc/tests/reachability.py --llvm
          python3 compiler/mayc/tests/strength_reduction.py --llvm
      - name: Exercise bounded GC limits and retain actual codegen
        run: |
          python3 compiler/mayc/tests/test_limits.py
          python3 compiler/mayc/tests/limits.py --samples 1 --iterations 2000 --rounds 8 --heap-mib 4 --seeds 1 --self-test --output compiler/mayc/build/limits-ci
      - name: Regress compiler heap retention on the 4096-function graph
        run: python3 compiler/mayc/tests/limits.py --mode codegen --backend native --case graph --functions 4096 --samples 1 --iterations 16 --compile-timeout 60 --output compiler/mayc/build/limits-large-graph
      - name: Upload GC and codegen experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-codegen-limits
          path: |
            compiler/mayc/build/limits-ci/
            compiler/mayc/build/limits-large-graph/
          if-no-files-found: ignore
      - name: Verify native compiler and current entrypoints
        run: python3 compiler/mayc/tests/verify.py --compiler compiler/mayc/mayc_new
      - name: Execute strict documentation examples
        run: |
          python3 tests/docs/run.py
          python3 tools/mayfmt/tests/run.py
          python3 compiler/mayc/tests/comments.py --llvm
      - name: Verify contracts and error traces through LLVM
        run: |
          python3 compiler/mayc/tests/numeric_contracts.py --llvm
          python3 compiler/mayc/tests/stdlib_contracts.py --llvm
          python3 compiler/mayc/tests/strings.py --llvm
          python3 compiler/mayc/tests/file_io.py --llvm
          python3 compiler/mayc/tests/debug_traces.py --llvm
      - name: Verify project manager and language server
        run: |
          compiler/mayc/mayc_new tools/maypkg/main.may -o /tmp/maypkg
          python3 tools/maypkg/tests/test_workflows.py --binary /tmp/maypkg
          python3 tools/may/tests/run.py
          python3 tools/maylsp/tests/test_lsp.py
      - name: Verify native UI and complete desktop app
        run: python3 tests/ui/run.py --require-x11
      - name: Build and test an extracted release
        run: |
          python3 dist/tests/test_release.py
          python3 dist/package.py --compiler compiler/mayc/mayc_new --output /tmp/maylang.tar.gz --installer-output /tmp/maylang-installers
          python3 dist/tests/test_package.py /tmp/maylang.tar.gz
          python3 dist/tests/test_installer.py --archive /tmp/maylang.tar.gz --artifacts /tmp/maylang-installers
          python3 dist/tests/test_download_installer.py --artifacts /tmp/maylang-installers
      - name: Upload complete toolchain bundle
        uses: actions/upload-artifact@v4
        with:
          name: maylang-linux-x86_64
          path: |
            /tmp/maylang.tar.gz
            /tmp/maylang.tar.gz.sha256
            /tmp/maylang-installers/
      - name: Run language compliance checks
        run: python3 tests/compliance/run.py
      - name: Upload verification reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-verification
          path: |
            tests/compliance/verification.json
            tests/compliance/build/reports/*.json
            tests/compliance/build/verify-*/**/*.stdout
            tests/compliance/build/verify-*/**/*.stderr
            tests/compliance/build/fuzz/**
          if-no-files-found: ignore
  core-emulation:
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maylang-linux-x86_64
          path: /tmp/maylang-archive
      - name: Verify and extract the tested toolchain
        working-directory: /tmp/maylang-archive
        run: |
          sha256sum -c maylang.tar.gz.sha256
          mkdir /tmp/maylang-toolchain
          tar -xzf maylang.tar.gz -C /tmp/maylang-toolchain
      - name: Execute portable core on all targets
        run: |
          python3 -m venv /tmp/maylang-validation
          /tmp/maylang-validation/bin/python -m pip install unicorn==2.1.4
          set -- /tmp/maylang-toolchain/maylang-*/bin/mayc
          /tmp/maylang-validation/bin/python compiler/mayc/tests/core_runtime.py --compiler "$1" --require-emulation
  performance:
    if: github.event_name == 'workflow_dispatch'
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maylang-linux-x86_64
          path: /tmp/maylang-archive
      - name: Verify and extract the tested toolchain
        working-directory: /tmp/maylang-archive
        run: |
          sha256sum -c maylang.tar.gz.sha256
          mkdir /tmp/maylang-toolchain
          tar -xzf maylang.tar.gz -C /tmp/maylang-toolchain
      - name: Measure compiler, navigation and diagnostic performance without timing gates
        run: |
          set -- /tmp/maylang-toolchain/maylang-*/bin/mayc
          python3 compiler/mayc/tests/build_benchmark.py --compiler "$1" --samples 3 --report /tmp/build-benchmark.json
          set -- /tmp/maylang-toolchain/maylang-*/bin/maylsp
          python3 tools/maylsp/tests/benchmark_navigation.py --binary "$1" --files 10016 --report /tmp/navigation-benchmark.json
          python3 tools/maylsp/tests/benchmark_diagnostics.py --binary "$1" --files 10016 --report /tmp/diagnostic-benchmark.json
          set -- /tmp/maylang-toolchain/maylang-*/bin/may
          python3 tools/may/tests/benchmark.py --binary "$1" --compiler "$(dirname "$1")/mayc" --report /tmp/workspace-benchmark.json
          set -- /tmp/maylang-toolchain/maylang-*/bin/mayc
          python3 compiler/mayc/tests/limits.py --compiler "$1" --backend native llvm llvm-o3 --iterations 2000000 --samples 5 --rounds 256 --heap-mib 4 16 64 256 --pressure 64 --functions 512 --self-test --timeout 120 --output /tmp/gc-codegen-limits
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-benchmark
          path: |
            /tmp/build-benchmark.json
            /tmp/navigation-benchmark.json
            /tmp/diagnostic-benchmark.json
            /tmp/workspace-benchmark.json
            /tmp/gc-codegen-limits/
          if-no-files-found: ignore
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Compile and package the VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm exec --yes --package @vscode/vsce@3 -- vsce package --out /tmp/maylang.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: maylang-vscode
          path: /tmp/maylang.vsix
